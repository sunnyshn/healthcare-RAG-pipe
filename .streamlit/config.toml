[theme]
base = "light"
primaryColor = "#2F7A56"
backgroundColor = "#F4F1E8"
secondaryBackgroundColor = "#FFFCF8"
textColor = "#163028"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false

[client]
# Hide Python tracebacks/code from the browser; full detail still goes to the
# server logs. Keeps the deployed demo clean for visitors.
showErrorDetails = "none"
