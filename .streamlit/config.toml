[theme]
primaryColor = "#1F6B5A"
backgroundColor = "#F6F4F0"
secondaryBackgroundColor = "#EFECE6"
textColor = "#1C2422"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false

[client]
# Hide Python tracebacks/code from the browser; full detail still goes to the
# server logs. Keeps the deployed demo clean for visitors.
showErrorDetails = "none"
